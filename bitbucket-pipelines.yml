image: openjdk:11-slim

options:
  max-time: 10

pipelines:
  custom:
    # Build the app and run tests
    test:
      - step: &test
          name: Build and Test
          caches:
            - docker
            - maven
          script:
            - ./mvnw --batch-mode clean package -Dmaven.test.skip=true # Need to build Docker image before running tests
#            - ./mvnw --batch-mode docker:stop docker:start # start postgres (assumes we have docker runtime on host machine)
#            - ./mvnw --batch-mode test # run tests
#            - ./mvnw --batch-mode docker:stop # stop postgres
            - cp target/chatloop-training-*-elastic-beanstalk.zip target/chatloop-training-elastic-beanstalk.zip
          artifacts:
            - target/chatloop-training-elastic-beanstalk.zip
          services:
            - docker

    # Package the app (no tests), producing .zip file
    build_production:
      - step: &build_production
          name: Build
          caches:
            - docker
            - maven
          script:
            - ./mvnw --batch-mode clean package -Dmaven.test.skip=true
            - cp target/chatloop-training-*-elastic-beanstalk.zip target/chatloop-training-elastic-beanstalk.zip
          artifacts:
            - target/chatloop-training-elastic-beanstalk.zip
          services:
            - docker

    # Deploy to staging environment (no tests run)
    deploy_staging:
      - step: &deploy_staging
          services:
            - docker
          caches:
            - docker
            - maven
          script:
            - apt-get update
            - apt-get install -y unzip
            - apt-get install -y curl unzip
            - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            - unzip awscliv2.zip
            - ./aws/install
            - export AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
            - export AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
            - export AWS_DEFAULT_REGION=ap-southeast-2
            - aws configure list
            - aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 640879528632.dkr.ecr.ap-southeast-2.amazonaws.com
            - ./mvnw clean package -DskipTests --batch-mode
            - docker build -t 640879528632.dkr.ecr.ap-southeast-2.amazonaws.com/chatloop-user-training-staging:latest .
            - docker tag 640879528632.dkr.ecr.ap-southeast-2.amazonaws.com/chatloop-user-training-staging:latest 640879528632.dkr.ecr.ap-southeast-2.amazonaws.com/chatloop-user-training-staging:latest
            - docker tag 640879528632.dkr.ecr.ap-southeast-2.amazonaws.com/chatloop-user-training-staging:latest 640879528632.dkr.ecr.ap-southeast-2.amazonaws.com/chatloop-user-training-e2e:latest
            - docker push 640879528632.dkr.ecr.ap-southeast-2.amazonaws.com/chatloop-user-training-staging:latest
            - docker push 640879528632.dkr.ecr.ap-southeast-2.amazonaws.com/chatloop-user-training-e2e:latest
          variables:
            - AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
            - AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY

    # Deploy to production environment (no tests run), with manual trigger in BitBucket Pipeline browser interface
    deploy_production:
      - step: *build_production
      - step: &deploy_production
          name: Deploy to Production
          deployment: production
          trigger: manual
          script:
            - pipe: atlassian/aws-elasticbeanstalk-deploy:0.3.1
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: ap-southeast-2
                APPLICATION_NAME: neonkingkong
                ENVIRONMENT_NAME: production-user-training
                S3_BUCKET: elasticbeanstalk-ap-southeast-2-640879528632
                ZIP_FILE: target/chatloop-training-elastic-beanstalk.zip
                VERSION_LABEL: deploy-production-user-training-$BITBUCKET_BUILD_NUMBER
                DEBUG: "true"

  # All branches get built and tested
  default:
     - step: *test

  branches:
    # Tests all commits to master
    master:
      - step: *test
      # Deploys all commits to master automatically to the staging environment
      - step: *deploy_staging
      # Prepares all commits to master for manual deployment to production environment via the pipeline interface on BitBucket
      - step: *deploy_production
