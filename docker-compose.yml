version: "3"
# microservice sees DB's 5432 port since they in same network, but
# we expose to host port 5555 for pgadmin purposes; See .env file;
services:
  server:
    image: neonkingkong/chatloop-user-training
    ports:
      - 8888:8888
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CFUL_SPACE_ID=${CFUL_SPACE_ID}
      - CFUL_ENV_ID=${CFUL_ENV_ID}
      - CFUL_DELIVERY_TOKEN=${CFUL_DELIVERY_TOKEN}
      - RDS_HOSTNAME=${RDS_HOSTNAME}
      - RDS_PORT=${RDS_PORT}
      - RDS_DB_NAME=${RDS_DB_NAME}
      - RDS_USERNAME=${RDS_USERNAME}
      - RDS_PASSWORD=${RDS_PASSWORD}
    build:
      context: .
    links:
      - db
  db:
    image: postgres:11.4-alpine
    ports:
      - 5555:5432
    environment:
      - POSTGRES_DB=${RDS_DB_NAME}
      - POSTGRES_USER=${RDS_USERNAME}
      - POSTGRES_PASSWORD=${RDS_PASSWORD}
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - 29000:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    links:
      - db
