version: "3"
services:
  server:
    image: neonkingkong/chatloop-training
    ports:
      - 8888:8888
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - RDS_HOSTNAME=db
      - RDS_USERNAME=cut
      - RDS_PASSWORD=cut
      - RDS_DB_NAME=cut
      - RDS_PORT=5432
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=ap-southeast-2
    build:
      context: .
    links:
      - db
  db:
    image: postgres:11.4-alpine
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=cut
      - POSTGRES_PASSWORD=cut
      - POSTGRES_DB=cut
