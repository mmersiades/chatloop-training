version: "3"
# microservice sees DB's 5432 port since they in same network, but
# we expose to host port 5555 for pgadmin purposes; See .env file;
services:
  server:
    image: neonkingkong/chatloop-user-training
    ports:
      - 8888:8888
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - RDS_HOSTNAME=db
      - RDS_USERNAME=cut
      - RDS_PASSWORD=cut
      - RDS_DB_NAME=cut
      - RDS_PORT=5432
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=ap-southeast-2
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    build:
      context: .
    links:
      - db
  db:
    image: postgres:11.4-alpine
    ports:
      - 5555:5432
    environment:
      - POSTGRES_USER=cut
      - POSTGRES_PASSWORD=cut
      - POSTGRES_DB=cut
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - 29000:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@chatloop.io
      - PGADMIN_DEFAULT_PASSWORD=admin
    links:
      - db
