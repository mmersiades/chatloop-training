# postgres properties
# cut = chatloop user training; using diff port so that it doesn't conflict with Monolith's instance
spring.datasource.url=jdbc:postgresql://localhost:5555/cut
spring.datasource.username=cut
spring.datasource.password=cut
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# monolith rest api
chatloop.monolith.rest.endpoint=http://localhost:8080/rest

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.FilterChainProxy=DEBUG

spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.format_sql=true

spring.devtools.livereload.enabled=false

app.mockData.cleanTables=true

