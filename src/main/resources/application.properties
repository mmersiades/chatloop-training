# Port is changed so that it doesn't conflict with monolith's
server.port=8888

spring.jpa.open-in-view=false

# mapping/path should not be changed;
graphql.servlet.mapping=/graphql
graphql.servlet.enabled=true
graphql.servlet.exception-handlers-enabled= true
graphql.servlet.contextSetting= PER_REQUEST_WITH_INSTRUMENTATION

# JWT secret key
security.jwt.mac.secret=${JWT_SECRET_KEY}

# Contentful properties
contentful.spaceId=${CFUL_SPACE_ID}
contentful.envId=${CFUL_ENV_ID}
contentful.deliveryToken=${CFUL_DELIVERY_TOKEN}
contentful.locale=en-US
contentful.previewToken=
# if true, it will log every fetched program/course/module name/ID; useful for troubleshooting;
contentful.log.fetched=true

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# https://docs.spring.io/spring-boot/docs/2.1.0.M1/reference/html/howto-database-initialization.html
spring.datasource.initialization-mode=always
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none

# postgres properties
spring.datasource.url=jdbc:postgresql://${RDS_HOSTNAME}:${RDS_PORT}/${RDS_DB_NAME}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# https://stackoverflow.com/questions/42228150/hibernate-5-sequencegenerator-not-giving-the-right-value
spring.jpa.hibernate.use-new-id-generator-mappings=true

app.mockData.cleanTables=false

chatloop.monolith.rest.endpoint=${MONOLITH_REST_ENDPOINT}











